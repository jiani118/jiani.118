<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WebOS</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: linear-gradient(135deg, #0b3f8f, #0d6efd);
        color: white;
      }
      .card {
        max-width: 640px;
        padding: 2rem 2.5rem;
        border-radius: 20px;
        background: rgba(255,255,255,0.08);
        border: 1px solid rgba(255,255,255,0.16);
        box-shadow: 0 20px 50px rgba(0,0,0,0.25);
      }
      h1 { margin-top: 0; }
      p { line-height: 1.6; }
      a {
        color: #dfeeff;
        text-decoration: none;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>WebOS</h1>
      <p>GitHub Pages 现在已经能正常构建了。</p>
      <p>这个仓库的 Pages 配置原来指向 <code>docs/</code>，但该目录不存在，导致 Jekyll 在构建时抛出 <code>No such file or directory @ dir_chdir0 - /github/workspace/docs</code>。</p>
      <p>已新增 <code>docs/</code> 目录以满足 Pages 构建要求。</p>
      <p><a href="https://github.com/jiani118/jiani.118">查看仓库</a></p>
    </main>
  </body>
</html>
